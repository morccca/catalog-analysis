[project]
name = "catalog-analysis"
version = "0.1.0"
authors = [{name = "Naumov Pavel"}]
description = "Аналитика каталога фильмов"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["ruff>=0.11,<1"]

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [".venv", "dist", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []
